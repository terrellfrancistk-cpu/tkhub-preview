    <script>
      // Theme before first paint (lib/theme.ts): Light / Dark / System, Dark default
      // (Terrell, 2026-11-13). Nothing stored, or storage blocked, means Dark.
      (function () {
        var root = document.documentElement;
        root.setAttribute("data-theme", "dark");
        try {
          var t = localStorage.getItem("radr.theme.v1");
          if (t === "light") root.setAttribute("data-theme", "light");
          if (t === "system") root.removeAttribute("data-theme");
          if (t !== "light" && t !== "system") t = "dark";
          var light = t === "light" || (t !== "dark" && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
          if (light) root.classList.remove("dark");
        } catch (e) {}
      })();
    </script>

    <script>
      // A NOIR (or other app) Google return can fall back onto this site's
      // homepage with a token in the hash or a code in the query. Drop it
      // before the app boots. /auth/callback keeps its own ?code=.
      (function () {
        var path = location.pathname || "/";
        var onCallback = path.indexOf("/auth/callback") !== -1;
        var hash = location.hash || "";
        var search = location.search || "";
        var foreignHash = hash.indexOf("access_token=") !== -1 || hash.indexOf("refresh_token=") !== -1;
        var strayCode = !onCallback && search.indexOf("code=") !== -1;
        if (!foreignHash && !strayCode) return;
        var keep = onCallback ? search : "";
        history.replaceState(null, "", path + keep);
      })();
    </script>
