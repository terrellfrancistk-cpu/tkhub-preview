<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RADR · Try it (demo)</title><meta name="robots" content="noindex">
<style>
:root{--bg:#0A0D0A;--sf:#141914;--rs:#1B231C;--ln:#233026;--sc:#1FE08A;--amb:#FFB020;--warn:#FF4D4D;--ink:#E8F0EA;--mut:#7A8C7F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font:15px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.demo{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:60;font:800 10px ui-monospace,monospace;letter-spacing:.14em;background:var(--amb);color:#000;padding:3px 9px;border-radius:99px}
.scr{flex:1;overflow-y:auto;padding:44px 16px 96px}
.h1{font-size:28px;font-weight:800;letter-spacing:.01em;text-transform:uppercase}.mut{color:var(--mut);font-size:13px}.mono{font-family:ui-monospace,"SF Mono",monospace}
.k{font:700 10px ui-monospace,monospace;letter-spacing:.16em;color:var(--sc);text-transform:uppercase}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-top:12px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--sc);color:#04140b;font-weight:800;font-size:15px;text-align:center;margin-top:12px;letter-spacing:.02em}
.btn.ghost{background:transparent;border:1px solid var(--ln);color:var(--ink)}.btn.red{background:var(--warn);color:#fff}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1}
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(10,13,10,.97);border-top:1px solid var(--ln);padding:8px 2px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10px;gap:2px;color:var(--mut)}.tabs button.on{color:var(--sc)}.tabs b{font-size:19px;line-height:1}
.map{position:relative;height:330px;border-radius:16px;overflow:hidden;border:1px solid var(--ln);background:radial-gradient(circle at 50% 60%,#11221a,#070a07)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;border:2px solid;background:#0a0d0acc}
.me{position:absolute;left:50%;top:62%;width:16px;height:16px;border-radius:50%;background:var(--sc);transform:translate(-50%,-50%);box-shadow:0 0 0 6px #1fe08a33,0 0 0 18px #1fe08a14}
.sweep{position:absolute;left:50%;top:62%;width:300px;height:300px;margin:-150px;border-radius:50%;background:conic-gradient(from 0deg,#1fe08a40,transparent 60deg);animation:sw 3.2s linear infinite}
@keyframes sw{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.rep{background:var(--rs);border:1px solid var(--ln);border-radius:12px;padding:10px 4px;text-align:center;font-size:11.5px;font-weight:600}.rep span{display:block;font-size:22px}
.al{border-left:3px solid var(--amb)}.al.w{border-left-color:var(--warn)}
.toast{position:absolute;left:14px;right:14px;bottom:88px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:700;z-index:70;font-size:14px}
.big{font:800 46px ui-monospace,monospace;color:var(--sc)}
.bar{height:6px;border-radius:9px;background:var(--rs);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--sc)}
.rec{width:12px;height:12px;border-radius:50%;background:var(--warn);animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--ln);font-size:13px;font-weight:600}.chip.on{background:var(--sc);color:#04140b;border-color:var(--sc)}
.wave{display:flex;gap:3px;align-items:center;height:40px}.wave i{width:4px;background:var(--sc);border-radius:2px;animation:wv 1s ease-in-out infinite}@keyframes wv{50%{height:8px}}
</style></head><body><div id="app"></div>
<script src="try-bridge.js"></script>
<script>
/* RADR demo. Runs entirely in this page: no location, no camera, no microphone, no network, no account. */
const $=s=>document.querySelector(s),app=$('#app');
const TYPES=[['police','Police','🚓','#4DA3FF'],['radar','Radar trap','📡','#FFB020'],['cam','Speed camera','📷','#FFB020'],['red','Red light camera','🚦','#FF4D4D'],['crash','Collision','💥','#FF4D4D'],['hazard','Road hazard','⚠️','#FFB020']];
const S={screen:'signin',tab:'map',pins:[['police',30,30,'Vine St','92% reliable',4],['cam',72,22,'Route 9 NB','fixed',0],['radar',22,78,'Old Mill Rd','78% reliable',9],['hazard',78,70,'I-80 EB','debris in lane',2]],report:false,alerts:[],rec:null,drives:[{d:'Yesterday',mi:14.2,top:58,avg:31,over:0},{d:'Mon',mi:6.8,top:44,avg:24,over:3}],ticket:null,radio:false};
let toastT;function toast(t){clearTimeout(toastT);let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';app.appendChild(e)}e.textContent=t;toastT=setTimeout(()=>e.remove(),2600)}
const T=k=>TYPES.find(t=>t[0]===k);
function go(t){S.tab=t;render()}
function render(){let h='<div class="demo">DEMO</div>';if(S.screen==='signin')h+=signin();else h+=`<div class="scr">${({map,alerts,radio,box,defence,profile})[S.tab]()}</div>`+tabs();app.innerHTML=h}
function tabs(){return `<nav class="tabs">${[['map','Map','🗺️'],['alerts','Alerts','🔔'],['radio','Radio','◉'],['box','Black Box','◎'],['defence','Defence','⛨'],['profile','Profile','☺']].map(([k,l,i])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}${k==='alerts'&&S.alerts.length?' •':''}</button>`).join('')}</nav>`}
function signin(){return `<div class="scr" style="display:flex;flex-direction:column;justify-content:center"><p class="k">Road scope · Black Box · Defence file</p><div class="h1" style="font-size:54px;margin-top:6px;color:var(--sc)">RADR</div><p style="font-size:18px;font-weight:700;margin-top:4px">See it before it sees you.</p><p class="mut" style="margin-top:8px">Police, radar, cameras and hazards on a live map. A Black Box for every drive. Practices that bid to fight your ticket.</p><button class="btn" onclick="S.screen='app';render();startAlerts()">Continue with demo account</button><button class="btn ghost" onclick="toast('Sign-in is off in the demo. Get the app to make an account.')">Sign in with Apple</button><p class="mut" style="margin-top:14px;text-align:center">Demo: sample map and drives. No location, camera or mic is used and nothing is sent.</p></div>`}
function map(){return `<div class="row"><div><p class="k">Road scope</p><div class="h1">Live map</div></div><span class="sp"></span><span class="mono mut">${S.pins.length} nearby</span></div><div class="map" style="margin-top:10px"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><g stroke="#233026" stroke-width=".8" fill="none"><path d="M0 62H100M50 0V100M0 20L100 90M10 100L90 0"/><path d="M0 40H100M75 0V100M25 0V100" stroke-width=".4"/></g></svg><div class="sweep"></div>${S.pins.map((p,i)=>{const t=T(p[0]);return `<button class="pin" style="left:${p[1]}%;top:${p[2]}%;border-color:${t[3]}" onclick="pinInfo(${i})">${t[2]}</button>`}).join('')}<div class="me"></div></div><button class="btn red" onclick="S.report=!S.report;render()">${S.report?'Close':'＋ Report'}</button>${S.report?`<div class="grid">${TYPES.map(t=>`<button class="rep" onclick="report('${t[0]}')"><span>${t[2]}</span>${t[1]}</button>`).join('')}</div>`:''}${S.pins.map((p,i)=>{const t=T(p[0]);return `<button class="card row" style="width:100%;text-align:left;padding:10px 12px" onclick="pinInfo(${i})"><span style="font-size:20px">${t[2]}</span><div><b>${t[1]} · ${p[3]}</b><br><span class="mut">${p[4]} · ${p[5]?p[5]+' min old':'just now'}</span></div></button>`}).join('')}`}
function pinInfo(i){const p=S.pins[i],t=T(p[0]);toast(`${t[1]} · ${p[3]} — tap 👍 in the app to confirm it's still there.`)}
function report(k){S.pins.unshift([k,35+Math.random()*30,45+Math.random()*12,'Your location','reported by you',0]);S.report=false;toast(T(k)[1]+' reported (demo). Nothing was sent.');render()}
let alertT;function startAlerts(){clearInterval(alertT);const L=[['radar','Radar trap ahead','0.6 mi · Old Mill Rd',0],['police','Police reported','1.2 mi · Vine St',0],['red','Red light camera','0.3 mi · Alder Ave',1]];let n=0;alertT=setInterval(()=>{if(n>=L.length){clearInterval(alertT);return}S.alerts.unshift(L[n++]);if(S.tab==='alerts'||S.tab==='map'){toast('🔔 '+S.alerts[0][1]+' · '+S.alerts[0][2])}if(S.tab==='alerts')render();else if(S.screen==='app')render()},9000)}
function alerts(){return `<p class="k">Heads up</p><div class="h1">Alerts</div>${S.alerts.length?S.alerts.map(a=>`<div class="card al ${a[3]?'w':''} row"><span style="font-size:22px">${T(a[0])[2]}</span><div><b>${a[1]}</b><br><span class="mut">${a[2]} · spoken aloud while you drive</span></div></div>`).join(''):'<div class="card"><b>Quiet road</b><p class="mut">Alerts arrive as you drive. Give it a few seconds.</p></div>'}<div class="card"><b>Alert distance</b><div class="chips">${['0.25 mi','0.5 mi','1 mi'].map((x,i)=>`<button class="chip ${i===1?'on':''}" onclick="toast('Set to ${x} (demo)')">${x}</button>`).join('')}</div></div>`}
function radio(){return `<p class="k">Radio and recordings</p><div class="h1">Scanner</div><div class="card"><div class="row"><div><b>County dispatch · sample</b><br><span class="mut">Public scanner feed, where it's legal to listen</span></div><span class="sp"></span>${S.radio?'<span class="rec"></span>':''}</div>${S.radio?`<div class="wave" style="margin-top:12px">${Array.from({length:28},(_,i)=>`<i style="height:${10+(i*37%28)}px;animation-delay:${(i%7)/10}s"></i>`).join('')}</div><p class="mut mono">“Unit 12, traffic stop, Vine and 4th…” (demo transcript)</p>`:''}<button class="btn ${S.radio?'ghost':''}" onclick="S.radio=!S.radio;render()">${S.radio?'Stop listening':'▶ Listen (demo)'}</button></div><div class="card"><b>Recordings</b><div class="row" style="margin-top:8px"><span>🎙️</span><div><b>Traffic stop · Mon 6:42 PM</b><br><span class="mut">3:18 · saved on this phone only</span></div></div></div>`}
let recT;function box(){const r=S.rec;return `<p class="k">Black Box</p><div class="h1">Drives</div>${r?`<div class="card"><div class="row"><span class="rec"></span><b>Recording drive</b><span class="sp"></span><span class="mono">${Math.floor(r.s/60)}:${String(r.s%60).padStart(2,'0')}</span></div><div class="row" style="margin-top:10px"><div><p class="mut">Speed</p><div class="big">${r.mph}</div><p class="mut">mph · limit 45</p></div><span class="sp"></span><div style="text-align:right"><p class="mut">Distance</p><p class="mono" style="font-size:22px">${r.mi.toFixed(2)} mi</p><p class="mut">Top ${r.top} mph</p></div></div><button class="btn red" onclick="stopDrive()">Stop and save</button></div>`:`<button class="btn" onclick="startDrive()">● Start a drive</button><p class="mut" style="margin-top:6px">Logs speed, route and limits. Stays on your phone.</p>`}${S.drives.map(d=>`<div class="card"><div class="row"><b>${d.d}</b><span class="sp"></span><span class="mono">${d.mi.toFixed(1)} mi</span></div><div class="row mono mut" style="margin-top:6px;gap:16px"><span>Top ${d.top}</span><span>Avg ${d.avg}</span><span style="color:${d.over?'var(--amb)':'var(--sc)'}">${d.over?d.over+' over limit':'Clean'}</span></div></div>`).join('')}`}
function startDrive(){S.rec={s:0,mph:0,mi:0,top:0};recT=setInterval(()=>{const r=S.rec;if(!r)return;r.s++;r.mph=Math.max(0,Math.min(52,Math.round(r.mph+(Math.random()*9-3.5))));r.top=Math.max(r.top,r.mph);r.mi+=r.mph/3600;if(S.tab==='box')render()},1000);render()}
function stopDrive(){clearInterval(recT);const r=S.rec;S.drives.unshift({d:'Just now',mi:r.mi,top:r.top,avg:Math.round(r.mi/(r.s/3600||1)),over:r.top>45?1:0});S.rec=null;toast('Drive saved on this phone (demo).');render()}
function defence(){const t=S.ticket;if(!t)return `<p class="k">Defence file</p><div class="h1">Fight a ticket</div><p class="mut">Snap your citation. Practices bid to take it. You pick.</p><div class="card"><b>1 · Your ticket</b><p class="mut">Sample: Speeding 54 in a 40 · Tarrant County</p><button class="btn" onclick="S.ticket={stage:'bids'};render();setTimeout(()=>{if(S.ticket){S.ticket.bids=3;render()}},2500)">📷 Use sample ticket</button></div><div class="card mut">Your Black Box drive for that day is attached only if you choose.</div>`;
 if(t.stage==='bids')return `<p class="k">Defence file</p><div class="h1">Bids</div><p class="mut">Speeding 54/40 · Tarrant County</p>${t.bids?[['Lone Star Traffic Law','$149','4.9★ · 1,200 cases'],['North TX Defense','$175','4.8★ · 860 cases'],['Ruiz & Park','$199','4.9★ · 410 cases']].map(b=>`<div class="card"><div class="row"><div><b>${b[0]}</b><br><span class="mut">${b[2]} · flat fee, no cold calls</span></div><span class="sp"></span><b class="mono" style="font-size:18px">${b[1]}</b></div><button class="btn" onclick="S.ticket={stage:'hired',firm:'${b[0]}',fee:'${b[1]}'};toast('Hired (demo). Nothing was charged.');render()">Hire</button></div>`).join(''):'<div class="card"><b>Waiting for bids…</b><div class="bar"><i style="width:40%"></i></div></div>'}`;
 return `<p class="k">Defence file</p><div class="h1">Case open</div><div class="card"><b>${t.firm}</b><p class="mut">${t.fee} flat · they'll appear for you</p>${['Ticket received','Practice assigned','Court date requested','Outcome'].map((s,i)=>`<div class="row" style="margin-top:8px"><span style="color:${i<2?'var(--sc)':'var(--mut)'}">${i<2?'●':'○'}</span>${s}</div>`).join('')}</div><button class="btn ghost" onclick="S.ticket=null;render()">Start over</button>`}
function profile(){return `<p class="k">Profile</p><div class="h1">Demo driver</div><div class="card"><div class="row"><b>Reports confirmed</b><span class="sp"></span><span class="mono">${12+S.pins.length-4}</span></div><div class="row" style="margin-top:6px"><b>Drives logged</b><span class="sp"></span><span class="mono">${S.drives.length}</span></div><div class="row" style="margin-top:6px"><b>Theme</b><span class="sp"></span><span class="mono" style="color:var(--sc)">Nightscope</span></div></div><div class="card mut">Your drives and recordings stay on your phone. Nothing here is stored on a server.</div><button class="btn ghost" onclick="clearInterval(alertT);clearInterval(recT);S.rec=null;S.screen='signin';render()">Sign out of demo</button>`}
render();
</script></body></html>
