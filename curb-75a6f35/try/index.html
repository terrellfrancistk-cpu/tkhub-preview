<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Curb · Try it (demo)</title><meta name="robots" content="noindex">
<style>
:root{--g:#13371e;--gd:#091e10;--c:#efeadb;--a:#6bdb8c;--lime:#c6f432;--ink:#1c1c1e;--mut:rgba(239,234,219,.62);--card:rgba(255,255,255,.06);--line:rgba(239,234,219,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--gd);color:var(--c);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--g)}
.demo{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:60;font-size:10px;letter-spacing:.12em;font-weight:800;background:var(--lime);color:#14200a;padding:3px 9px;border-radius:99px}
.scr{flex:1;overflow-y:auto;padding:44px 18px 96px}
.h1{font-size:30px;font-weight:800;letter-spacing:-.02em}.h2{font-size:19px;font-weight:750}.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--a);color:#06210f;font-weight:800;font-size:16px;text-align:center;margin-top:12px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--c)}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1}
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(9,30,16,.96);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(10px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10.5px;gap:3px;color:var(--mut)}.tabs button.on{color:var(--a)}.tabs svg{width:22px;height:22px}
.map{position:relative;height:300px;border-radius:22px;overflow:hidden;background:#0d2a17;border:1px solid var(--line)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid #fff;transform:translate(-50%,-50%)}
.car{position:absolute;font-size:20px;transform:translate(-50%,-50%);transition:left 1s linear,top 1s linear}
.where{display:flex;align-items:center;gap:10px;background:var(--c);color:var(--ink);border-radius:14px;padding:14px;font-weight:700;margin-top:-26px;position:relative;z-index:2;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.place{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.ico{width:36px;height:36px;border-radius:10px;background:rgba(107,219,140,.15);display:grid;place-items:center;flex:none}
.cls{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1.5px solid transparent;width:100%;text-align:left}
.cls.on{border-color:var(--a);background:rgba(107,219,140,.08)}
.price{font-weight:800;font-size:17px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(198,244,50,.16);color:var(--lime)}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end}
.sheet>div{background:var(--g);width:100%;border-radius:24px 24px 0 0;padding:20px 18px 30px;border-top:1px solid var(--line);max-height:88%;overflow:auto}
.stars button{font-size:32px;color:#555}.stars button.on{color:#ffcf3d}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-top:12px}.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mut)}.seg button.on{background:var(--c);color:var(--ink)}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--c);font:inherit;margin-top:8px}
.big{font-size:44px;font-weight:850;letter-spacing:-.03em}
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:var(--c);color:var(--ink);padding:12px 14px;border-radius:14px;font-weight:650;z-index:70;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--a);transition:width 1s linear}
</style></head><body><div id="app"></div>
<script src="try-bridge.js"></script>
<script>
/* Curb demo. Runs entirely in this page: no network calls, no account, no card, no texts. */
const $=s=>document.querySelector(s), app=$('#app');
const money=n=>'$'+n.toFixed(2);
const S={screen:'signin',tab:'ride',mode:'rider',dest:null,cls:'standard',ride:null,eatCart:[],online:false,earn:0,trips:[]};
const PLACES=[{n:'DFW Terminal D',a:'2333 S International Pkwy',mi:19.4},{n:'Sundance Square',a:'420 Main St, Fort Worth',mi:2.1},{n:'Dickies Arena',a:'1911 Montgomery St',mi:3.6},{n:'Clearfork',a:'5188 Monahans Ave',mi:5.2},{n:'TCU',a:'2800 S University Dr',mi:3.9}];
const CLASSES=[['saver','Saver','4 seats · a short walk',.82,'🚗'],['standard','Standard','4 seats',1,'🚙'],['pet','Pet','Room for a pet',1.15,'🐕'],['xl','XL','6 seats',1.45,'🚐'],['electric','Electric','4 seats · zero tailpipe',1.1,'⚡'],['premium','Premium','Newer car, top-rated',1.75,'🚘'],['luxury','Luxury','Black car service',2.4,'🖤']];
function quote(p,c){const base=3+p.mi*1.32+p.mi*1.9*.28;const m=CLASSES.find(x=>x[0]===c)[3];return Math.round(base*m*100)/100}
const icons={ride:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 11l1.5-4.5A2 2 0 0 1 8.4 5h7.2a2 2 0 0 1 1.9 1.5L19 11v6a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H8v1a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zm2.2-1h9.6l-1-3H8.2zM7.5 14a1 1 0 1 0 0-2 1 1 0 0 0 0 2m9 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/></svg>',deliver:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 7h12l1 13H5zm3 0a3 3 0 0 1 6 0h-1.6a1.4 1.4 0 0 0-2.8 0z"/></svg>',rent:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 4a6 6 0 1 1-1.9 11.7L10 18H8v2H4v-4l6.3-6.3A6 6 0 0 1 14 4m2 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3"/></svg>',kids:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="5" r="2.5"/><circle cx="16.5" cy="8" r="2"/><path d="M5 9h6v6H9.5v6h-3v-6H5zm9.5 2h4v5h-1v5h-2v-5h-1z"/></svg>',account:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20m0 4a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7m0 9c-2.7 0-5 1.3-6.2 3.2A8 8 0 0 0 12 20a8 8 0 0 0 6.2-1.8C17 16.3 14.7 15 12 15"/></svg>'};
let toastT;function toast(t){clearTimeout(toastT);let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';app.appendChild(e)}e.textContent=t;toastT=setTimeout(()=>e.remove(),2600)}
function mapSVG(route){return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="rgba(239,234,219,.06)"/></pattern></defs><rect width="400" height="300" fill="url(#g)"/><path d="M-10 210 C80 180 120 240 210 200 S330 120 410 150" stroke="#1d5a8a" stroke-width="16" fill="none" opacity=".55"/><g stroke="rgba(239,234,219,.18)" stroke-width="7" fill="none"><path d="M0 90H400M0 160H400M120 0V300M260 0V300M40 0L360 300"/></g>${route?'<path d="M90 230 L120 160 L260 160 L300 70" stroke="#6bdb8c" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="2 0"/>':''}</svg>`}
function tabs(){const t=S.mode==='rider'?[['ride','Ride'],['deliver','Deliver'],['rent','Rent & Buy'],['kids','Kids'],['account','Account']]:[['go','Go'],['earnings','Earnings'],['account','Account']];return `<nav class="tabs">${t.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')">${icons[k]||icons.ride}${l}</button>`).join('')}</nav>`}
function go(t){S.tab=t;render()}
function render(){let h='<div class="demo">DEMO</div>';
 if(S.screen==='signin')h+=signin();else{h+=`<div class="scr">${({ride:rideTab,deliver:eatTab,rent:rentTab,kids:kidsTab,account:accountTab,go:driverGo,earnings:earnTab})[S.tab]()}</div>`+tabs()}
 app.innerHTML=h;afterRender()}
function signin(){return `<div class="scr" style="display:flex;flex-direction:column;justify-content:center;padding-bottom:40px"><div style="font-size:54px;font-weight:900;letter-spacing:-.04em">curb</div><p class="h2" style="margin-top:6px">Rides where the driver keeps the whole fare.</p><p class="mut" style="margin-top:8px">Fort Worth · Every price is the whole fare, tax inside. No tip screen.</p><button class="btn" onclick="S.screen='app';render()">Continue with demo account</button><button class="btn ghost" onclick="toast('Sign-in is off in the demo. Get the app to make an account.')">Sign in with phone</button><p class="mut" style="margin-top:14px;text-align:center">Demo: sample drivers and prices. Nothing is booked, charged or texted.</p></div>`}
function rideTab(){const r=S.ride;
 if(r)return liveRide();
 let h=`<div class="row"><div><p class="mut">Good evening, Demo</p><div class="h1">Where to?</div></div><div class="sp"></div><span class="pill">0% driver fee</span></div><div class="map" style="margin-top:14px">${mapSVG(!!S.dest)}<div class="pin" style="left:22.5%;top:76%;background:#4aa3ff"></div>${S.dest?'<div class="pin" style="left:75%;top:23%;background:#6bdb8c"></div>':''}<div class="car" style="left:40%;top:52%">🚙</div><div class="car" style="left:66%;top:31%">🚗</div><div class="car" style="left:30%;top:30%">🚙</div></div>`;
 if(!S.dest){h+=`<div class="where" onclick="toast('Pick one of the places below in the demo.')"><span>🔍</span>Search a destination</div><div class="card" style="padding:4px 14px">${PLACES.map((p,i)=>`<button class="place" onclick="S.dest=PLACES[${i}];render()"><span class="ico">📍</span><span><b>${p.n}</b><br><span class="mut">${p.a}</span></span><span class="sp"></span><span class="mut">${p.mi} mi</span></button>`).join('')}</div><div class="card row"><span class="ico">📅</span><div><b>Schedule a ride</b><p class="mut">Price locked now. We find a driver 15 minutes before.</p></div></div>`}
 else{const q=quote(S.dest,S.cls);h+=`<div class="card"><div class="row"><b>Choose your ride</b><span class="sp"></span><button class="mut" onclick="S.dest=null;render()">Change</button></div><p class="mut">To ${S.dest.n} · ${S.dest.mi} mi · ${Math.round(S.dest.mi*2.1+4)} min</p>${CLASSES.map(c=>`<button class="cls ${S.cls===c[0]?'on':''}" onclick="S.cls='${c[0]}';render()"><span style="font-size:26px">${c[4]}</span><span><b>${c[1]}</b><br><span class="mut">${c[2]}</span></span><span class="sp"></span><span class="price">${money(quote(S.dest,c[0]))}</span></button>`).join('')}<p class="mut" style="margin-top:8px">Every price is the whole fare, tax inside. No tip screen.</p></div><div class="card"><div class="row"><b>Total</b><span class="sp"></span><span class="price">${money(q)}</span></div><p class="mut" style="margin-top:6px">Your driver keeps ${money(q)} — no tip screen after.</p><div class="row" style="margin-top:8px"><span class="mut">💳 Demo card •••• 4242</span></div></div><button class="btn" onclick="request()">Request ${CLASSES.find(c=>c[0]===S.cls)[1]}</button>`}
 return h}
const DRIVERS=[{n:'Marcus',car:'Toyota Camry · Silver',plate:'CRB 4821',r:4.97,trips:2310},{n:'Alicia',car:'Honda Accord · Black',plate:'TXF 1903',r:4.99,trips:1544},{n:'Dee',car:'Tesla Model 3 · White',plate:'EV 0731',r:4.95,trips:876}];
let rideTimer;
function request(){S.ride={phase:'finding',dest:S.dest,cls:S.cls,fare:quote(S.dest,S.cls),driver:DRIVERS[Math.floor(Math.random()*3)],eta:4,prog:0};render();clearInterval(rideTimer);
 setTimeout(()=>{if(!S.ride)return;S.ride.phase='coming';render();rideTimer=setInterval(()=>{const r=S.ride;if(!r){clearInterval(rideTimer);return}r.prog+=r.phase==='coming'?25:20;if(r.phase==='coming'&&r.prog>=100){r.phase='trip';r.prog=0}else if(r.phase==='trip'&&r.prog>=100){r.phase='done';clearInterval(rideTimer)}if(S.tab==='ride')render()},1400)},2200)}
function liveRide(){const r=S.ride,d=r.driver;
 if(r.phase==='finding')return `<div class="h1">Finding your driver</div><p class="mut">Offering your ride to the nearest ${CLASSES.find(c=>c[0]===r.cls)[1]} drivers…</p><div class="map" style="margin-top:14px">${mapSVG(true)}<div class="pin" style="left:22.5%;top:76%;background:#4aa3ff;box-shadow:0 0 0 18px rgba(74,163,255,.18)"></div></div><button class="btn ghost" onclick="cancelRide()">Cancel — free</button>`;
 if(r.phase==='done')return `<div class="h1">You're at ${r.dest.n}</div><div class="card"><div class="row"><b>${money(r.fare)}</b><span class="sp"></span><span class="pill">${d.n} keeps all of it</span></div><p class="mut" style="margin-top:6px">Demo card •••• 4242 · nothing was charged</p></div><div class="card"><b>How was the ride?</b><div class="stars row" style="margin-top:8px">${[1,2,3,4,5].map(i=>`<button class="${(r.stars||0)>=i?'on':''}" onclick="S.ride.stars=${i};render()">★</button>`).join('')}</div></div><button class="btn" onclick="finishRide()">Done</button>`;
 const coming=r.phase==='coming',left=coming?(40-17.5*r.prog/100):(22.5+52.5*r.prog/100),top=coming?(52+24*r.prog/100):(76-53*r.prog/100);
 return `<div class="h1">${coming?d.n+' is '+Math.max(1,Math.round(r.eta*(1-r.prog/100)))+' min away':'On the way to '+r.dest.n}</div><div class="map" style="margin-top:14px">${mapSVG(true)}<div class="pin" style="left:22.5%;top:76%;background:#4aa3ff"></div><div class="pin" style="left:75%;top:23%;background:#6bdb8c"></div><div class="car" style="left:${left}%;top:${top}%">🚙</div></div><div class="prog"><i style="width:${r.prog}%"></i></div><div class="card row"><span class="ico" style="font-size:20px">🧑🏾</span><div><b>${d.n}</b> · ★ ${d.r}<br><span class="mut">${d.car} · ${d.trips} trips</span></div><span class="sp"></span><b>${d.plate}</b></div><div class="card row"><span>🔢</span><div><b>Ride PIN 4 7 1 9</b><p class="mut">Tell your driver before you get in.</p></div></div><div class="row" style="gap:8px"><button class="btn ghost" onclick="toast('Calls and texts are off in the demo.')">Message</button><button class="btn ghost" onclick="toast('Share-trip links are off in the demo.')">Share trip</button></div>${coming?'<button class="btn ghost" onclick="cancelRide()">Cancel ride</button>':''}`}
function cancelRide(){clearInterval(rideTimer);S.ride=null;toast('Ride cancelled. No fee in the demo.');render()}
function finishRide(){const r=S.ride;S.trips.unshift({when:'Just now',from:'Your spot',to:r.dest.n,fare:r.fare});S.ride=null;S.dest=null;toast('Thanks! Your rating went to '+r.driver.n+'.');render()}
const EATS=[{n:'Joe T. Garcia\'s (sample)',k:'Tex-Mex',t:'25–35 min',m:[['Enchilada plate',14.5],['Fajitas for one',18],['Chips & queso',7]]},{n:'Heim BBQ (sample)',k:'Barbecue',t:'30–40 min',m:[['Bacon burnt ends',16],['Brisket plate',19],['Mac & cheese',6]]},{n:'Funky Picnic (sample)',k:'Burgers',t:'20–30 min',m:[['Smash burger',12],['Fries',5],['Shake',7]]}];
function eatTab(){const total=S.eatCart.reduce((a,b)=>a+b[1],0);if(S.eat!=null){const e=EATS[S.eat];return `<button class="mut" onclick="S.eat=null;render()">‹ Curb Eats</button><div class="h1" style="margin-top:6px">${e.n}</div><p class="mut">${e.k} · ${e.t} · menu prices, no markup</p>${e.m.map((m,i)=>`<div class="card row"><div><b>${m[0]}</b><br><span class="mut">${money(m[1])}</span></div><span class="sp"></span><button class="pill" style="font-size:14px;padding:6px 12px" onclick="S.eatCart.push(EATS[${S.eat}].m[${i}]);toast('Added ${m[0]}');render()">Add</button></div>`).join('')}${S.eatCart.length?`<div class="card"><div class="row"><b>Cart · ${S.eatCart.length}</b><span class="sp"></span><b>${money(total)}</b></div><p class="mut">Delivery ${money(3.99)} · your courier keeps it all</p></div><button class="btn" onclick="S.eatCart=[];toast('Demo order placed. Nothing was charged or sent to a restaurant.');render()">Place demo order · ${money(total+3.99)}</button>`:''}`}
 return `<div class="h1">Curb Eats</div><p class="mut">Couriers keep the whole delivery fee.</p><div class="seg"><button class="on">Food</button><button onclick="toast('Groceries and packages: get the app.')">Groceries</button><button onclick="toast('Send a package: get the app.')">Packages</button></div>${EATS.map((e,i)=>`<button class="card row" style="width:100%;text-align:left" onclick="S.eat=${i};render()"><span class="ico" style="font-size:20px">🍽️</span><div><b>${e.n}</b><br><span class="mut">${e.k} · ${e.t}</span></div></button>`).join('')}`}
function rentTab(){const cars=[['2022 Toyota RAV4','$54/day','Near Magnolia'],['2021 Tesla Model Y','$79/day','Near Clearfork'],['2019 Ford F-150','$65/day','Near Stockyards']];return `<div class="h1">Rent & Buy</div><p class="mut">Cars, homes and things from people nearby.</p><div class="seg"><button class="on">Cars</button><button onclick="toast('Homes: get the app.')">Homes</button><button onclick="toast('Things: get the app.')">Things</button></div>${cars.map(c=>`<div class="card row"><span class="ico" style="font-size:20px">🚘</span><div><b>${c[0]}</b><br><span class="mut">${c[2]}</span></div><span class="sp"></span><b>${c[1]}</b></div>`).join('')}<button class="btn ghost" onclick="toast('Booking a rental is off in the demo.')">Book a sample car</button>`}
function kidsTab(){return `<div class="h1">Curb Kids</div><p class="mut">School runs with certified drivers and live tracking for parents.</p><div class="card"><b>Every Kids driver</b><p class="mut" style="margin-top:4px">Passes a background check and Kids certification, drives a car with the right seat, and confirms pickup with a code only you and the school know.</p></div><div class="card row"><span class="ico">🎒</span><div><b>Sample: Maya · 3:15 PM</b><br><span class="mut">Westcliff Elementary → Home</span></div></div><button class="btn ghost" onclick="toast('Kids rides need a verified parent account in the app.')">Schedule a Kids ride</button>`}
function accountTab(){const sample=[{when:'Today, 8:12 AM',from:'Sundance Square',to:'DFW Terminal D',fare:38.4},{when:'Yesterday, 6:40 PM',from:'Magnolia Ave',to:'Dickies Arena',fare:12.1}];const all=[...S.trips,...sample];
 return `<div class="row"><span class="ico" style="width:54px;height:54px;font-size:26px;border-radius:50%">🙂</span><div><div class="h2">Demo Rider</div><p class="mut">demo@curb · sample account</p></div></div><div class="seg"><button class="${S.mode==='rider'?'on':''}" onclick="S.mode='rider';S.tab='account';render()">Rider</button><button class="${S.mode==='driver'?'on':''}" onclick="S.mode='driver';S.tab='go';render()">Driver</button></div><div class="card"><b>Recent trips</b>${all.map(t=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><b>${t.to}</b><br><span class="mut">${t.when} · from ${t.from}</span></div><span class="sp"></span><b>${money(t.fare)}</b></div>`).join('')}<p class="mut" style="margin-top:8px">Drivers kept 100% of every fare.</p></div><div class="card"><b>Safety</b><p class="mut">Ride PIN, trip sharing, in-ride recording and an emergency button are in the app.</p></div><button class="btn ghost" onclick="S.screen='signin';render()">Sign out of demo</button>`}
let pingT;
function driverGo(){return `<div class="h1">${S.online?'You\'re online':'You\'re offline'}</div><p class="mut">Keep 100% of every fare. Curb charges riders, not you.</p><div class="map" style="margin-top:14px">${mapSVG(false)}<div class="pin" style="left:45%;top:55%;background:#c6f432;box-shadow:0 0 0 ${S.online?22:0}px rgba(198,244,50,.18)"></div></div>${S.ping?`<div class="card" style="border-color:var(--a)"><div class="row"><b>New ride · ${S.ping.mi} mi</b><span class="sp"></span><span class="price">${money(S.ping.fare)}</span></div><p class="mut">${S.ping.from} → ${S.ping.to}<br>You keep ${money(S.ping.fare)}</p><div class="row" style="gap:8px"><button class="btn ghost" onclick="S.ping=null;render()">Pass</button><button class="btn" onclick="S.earn+=S.ping.fare;toast('Demo trip done. You kept '+money(S.ping.fare)+'.');S.ping=null;render()">Accept</button></div></div>`:''}<button class="btn ${S.online?'ghost':''}" onclick="toggleOnline()">${S.online?'Go offline':'Go online'}</button><div class="card row"><b>Today</b><span class="sp"></span><span class="price">${money(S.earn)}</span></div>`}
function toggleOnline(){S.online=!S.online;clearTimeout(pingT);if(S.online)pingT=setTimeout(()=>{if(!S.online)return;const p=PLACES[Math.floor(Math.random()*5)];S.ping={mi:p.mi,fare:quote(p,'standard'),from:'Near you',to:p.n};if(S.tab==='go')render()},2500);render()}
function earnTab(){return `<div class="h1">Earnings</div><div class="card"><p class="mut">This week (demo)</p><div class="big">${money(412.6+S.earn)}</div><p class="mut">You kept 100% · Curb fee to you: $0.00</p></div><div class="card"><b>Payouts</b><p class="mut">Instant cash-out to your debit card in the app.</p></div>`}
function afterRender(){}
render();
</script></body></html>
