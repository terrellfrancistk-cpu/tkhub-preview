<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Booked · Try it (demo)</title><meta name="robots" content="noindex">
<style>
:root{--paper:#f6f4ef;--ink:#1f1b16;--acc:#c45c26;--red:#b03a2e;--mut:#6f675d;--line:#e3ddd2;--card:#fff;--ok:#2f7a4a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);font:15px/1.42 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.demo{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:60;font-size:10px;letter-spacing:.12em;font-weight:800;background:var(--ink);color:var(--paper);padding:3px 9px;border-radius:99px}
.scr{flex:1;overflow-y:auto;padding:44px 18px 96px}
.h1{font-family:"New York",Georgia,serif;font-size:30px;font-weight:700;letter-spacing:-.01em}.h2{font-size:18px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--acc);color:#fff;font-weight:750;font-size:16px;text-align:center;margin-top:12px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.cat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:12.5px;font-weight:600}.cat span{display:block;font-size:24px;margin-bottom:4px}
.cat.on{border-color:var(--acc);background:#fbefe7}
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(246,244,239,.97);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:10.5px;gap:2px;color:var(--mut)}.tabs button.on{color:var(--acc)}.tabs b{font-size:21px;line-height:1}
.av{width:44px;height:44px;border-radius:50%;background:#efe4d6;display:grid;place-items:center;font-weight:800;color:var(--acc);flex:none}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#fbefe7;color:var(--acc)}
.pill.ok{background:#e6f2ea;color:var(--ok)}
textarea,input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;color:var(--ink);margin-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps{margin-top:10px}.st{display:flex;gap:10px;align-items:flex-start;padding:7px 0}.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-top:3px;flex:none}.st.done .dot{background:var(--ok);border-color:var(--ok)}.st.now .dot{border-color:var(--acc);box-shadow:0 0 0 4px #fbefe7}
.bub{max-width:80%;padding:10px 13px;border-radius:16px;margin-top:8px;font-size:14px}.me{margin-left:auto;background:var(--acc);color:#fff;border-bottom-right-radius:4px}.them{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.toast{position:absolute;left:16px;right:16px;bottom:90px;background:var(--ink);color:var(--paper);padding:12px 14px;border-radius:14px;font-weight:600;z-index:70;font-size:14px}
.stars button{font-size:30px;color:#d6cfc3}.stars button.on{color:#e2a32b}
.big{font-family:Georgia,serif;font-size:40px;font-weight:700}
</style></head><body><div id="app"></div>
<script src="try-bridge.js"></script>
<script>
/* Booked demo. Runs entirely in this page: no network calls, no account, no card, no texts. */
const $=s=>document.querySelector(s),app=$('#app');const money=n=>'$'+Math.round(n);
const CATS=[['cleaning','Cleaning','🧽',120],['handyman','Handyman','🔧',95],['moving','Moving','📦',260],['plumbing','Plumbing','🚰',150],['electrical','Electrical','💡',140],['hvac','HVAC','❄️',180],['painting','Painting','🎨',320],['lawn','Lawn','🌿',60],['tvMount','TV mount','📺',90],['furnitureAssembly','Assembly','🪑',85],['detailing','Detailing','🚗',140],['pets','Pet care','🐾',45]];
const PROS=[['Rosa M.','RM',4.98,412,1.2],['Andre K.','AK',4.95,268,2.8],['Lin T.','LT',4.91,153,4.1],['Sam O.','SO',4.89,97,6.3]];
const S={screen:'signin',tab:'home',draft:null,jobs:[],chat:[],feed:null,earn:0};
let toastT;function toast(t){clearTimeout(toastT);let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';app.appendChild(e)}e.textContent=t;toastT=setTimeout(()=>e.remove(),2600)}
function go(t){S.tab=t;render()}
function render(){let h='<div class="demo">DEMO</div>';if(S.screen==='signin')h+=signin();else h+=`<div class="scr">${({home,jobs,chat,pro})[S.tab]()}</div>`+tabs();app.innerHTML=h;const c=$('.scr');if(S.tab==='chat'&&c)c.scrollTop=c.scrollHeight}
function tabs(){return `<nav class="tabs">${[['home','Home','⌂'],['jobs','Jobs','☰'],['chat','Chat','✉'],['pro','Pro','⚒']].map(([k,l,i])=>`<button class="${S.tab===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}${k==='jobs'&&S.jobs.some(j=>j.step<4)?' •':''}</button>`).join('')}</nav>`}
function signin(){return `<div class="scr" style="display:flex;flex-direction:column;justify-content:center"><div class="h1" style="font-size:46px">Booked<span style="color:var(--acc)">.</span></div><p class="h2" style="margin-top:6px">Local pros, booked at a price they can't raise.</p><p class="mut" style="margin-top:8px">Cleaning, repairs, moving and more. Pros keep what they quote.</p><button class="btn" onclick="S.screen='app';render()">Continue with demo account</button><button class="btn ghost" onclick="toast('Sign-in is off in the demo. Get the app to make an account.')">Sign in with email</button><p class="mut" style="margin-top:14px;text-align:center">Demo: sample pros and prices. Nothing is booked, charged or sent.</p></div>`}
function home(){const d=S.draft;
 if(d&&d.stage==='describe'){const c=CATS.find(x=>x[0]===d.cat);return `<button class="mut" onclick="S.draft=null;render()">‹ Back</button><div class="h1" style="margin-top:6px">${c[2]} ${c[1]}</div><p class="mut">Tell pros what you need.</p><textarea id="desc" rows="3" placeholder="e.g. Deep clean a 2-bed apartment, oven included">${d.desc||''}</textarea><div class="card"><b>When</b><div class="chips">${['Today','Tomorrow','Sat','Sun','Next week'].map(x=>`<button class="chip ${d.day===x?'on':''}" onclick="S.draft.desc=$('#desc').value;S.draft.day='${x}';render()">${x}</button>`).join('')}</div><div class="chips">${['8–10 AM','10–12','1–3 PM','3–5 PM'].map(x=>`<button class="chip ${d.win===x?'on':''}" onclick="S.draft.desc=$('#desc').value;S.draft.win='${x}';render()">${x}</button>`).join('')}</div></div><div class="card row"><span>📍</span><div><b>Sample address</b><br><span class="mut">Near Magnolia Ave · exact spot shared after booking</span></div></div><button class="btn" onclick="S.draft.desc=$('#desc').value;if(!S.draft.day||!S.draft.win){toast('Pick a day and a time window.');return}S.draft.stage='pros';render()">See matching pros</button>`}
 if(d&&d.stage==='pros'){const c=CATS.find(x=>x[0]===d.cat);return `<button class="mut" onclick="S.draft.stage='describe';render()">‹ Back</button><div class="h1" style="margin-top:6px">${PROS.length} pros nearby</div><p class="mut">${c[1]} · ${d.day}, ${d.win}. A pro accepts this price or passes. They can't raise it.</p>${PROS.map((p,i)=>{const pr=c[3]*(1+i*.07);return `<div class="card"><div class="row"><div class="av">${p[1]}</div><div><b>${p[0]}</b><br><span class="mut">${c[1]} · ${p[2]}★ · ${p[3]} jobs · ${p[4]} mi</span></div><span class="sp"></span><b style="font-size:18px">${money(pr)}</b></div><button class="btn" style="padding:11px;font-size:15px" onclick="book(${i},${pr})">Book ${p[0].split(' ')[0]}</button></div>`}).join('')}`}
 return `<p class="mut">Good evening, Demo</p><div class="h1">What needs doing?</div><div class="grid">${CATS.map(c=>`<button class="cat" onclick="S.draft={cat:'${c[0]}',stage:'describe'};render()"><span>${c[2]}</span>${c[1]}</button>`).join('')}</div><button class="card row" style="width:100%;text-align:left" onclick="S.draft={cat:'handyman',stage:'describe'};render()"><span style="font-size:22px">✍️</span><div><b>Custom job</b><br><span class="mut">Not on the list? Describe it, set a budget, and pros quote it.</span></div></button><div class="card"><div class="row"><b>Pros you'd rebook</b><span class="sp"></span><span class="pill">2 worked out</span></div>${PROS.slice(0,2).map(p=>`<div class="row" style="margin-top:10px"><div class="av">${p[1]}</div><div><b>${p[0]}</b><br><span class="mut">you rated them 5★</span></div><span class="sp"></span><button class="chip" onclick="S.draft={cat:'cleaning',stage:'describe'};render()">Rebook</button></div>`).join('')}</div>`}
function book(i,price){const d=S.draft,c=CATS.find(x=>x[0]===d.cat);const job={id:Date.now(),cat:c,pro:PROS[i],price,day:d.day,win:d.win,desc:d.desc,step:0};S.jobs.unshift(job);S.chat=[{me:0,t:`Hi! ${PROS[i][0].split(' ')[0]} here. Got your ${c[1].toLowerCase()} job for ${d.day}, ${d.win}. See you then!`}];S.draft=null;S.tab='jobs';toast('Booked (demo). Nothing was charged.');render();advance(job)}
function advance(job){const t=setInterval(()=>{if(job.step>=3){clearInterval(t);return}job.step++;if(job.step===1)S.chat.push({me:0,t:'On my way, about 12 minutes out.'});if(job.step===3)S.chat.push({me:0,t:'All done! Photos are in the job. Thanks for booking.'});if(S.screen==='app')render()},5000)}
const STEPS=['Booked','On the way','Working','Done'];
function jobs(){if(!S.jobs.length)return `<div class="h1">Jobs</div><div class="card"><b>No jobs yet</b><p class="mut">Book a pro from Home and track it here, step by step.</p></div><div class="card"><span class="pill">Sample</span><div class="row" style="margin-top:8px"><div class="av">RM</div><div><b>Deep clean · Done</b><br><span class="mut">Rosa M. · last Tuesday · $120</span></div></div></div><button class="btn" onclick="go('home')">Book a pro</button>`;
 return `<div class="h1">Jobs</div>${S.jobs.map((j,ji)=>`<div class="card"><div class="row"><div class="av">${j.pro[1]}</div><div><b>${j.cat[1]} · ${j.pro[0]}</b><br><span class="mut">${j.day}, ${j.win}</span></div><span class="sp"></span><b>${money(j.price)}</b></div><div class="steps">${STEPS.map((s,i)=>`<div class="st ${i<j.step||j.step===3&&i===3?'done':i===j.step?'now':''}"><span class="dot"></span><div><b>${s}</b>${i===1&&j.step===1?'<br><span class="mut">12 min away · live on the map in the app</span>':''}</div></div>`).join('')}</div>${j.step>=3?(j.stars?`<p class="mut">You rated ${j.stars}★. Paid ${money(j.price)} (demo, nothing charged).</p>`:`<b>Rate ${j.pro[0].split(' ')[0]}</b><div class="stars row">${[1,2,3,4,5].map(n=>`<button onclick="S.jobs[${ji}].stars=${n};toast('Thanks! Review saved in this demo.');render()">★</button>`).join('')}</div>`):`<div class="row" style="gap:8px"><button class="btn ghost" onclick="go('chat')">Message</button><button class="btn ghost" onclick="S.jobs.splice(${ji},1);toast('Cancelled free (demo).');render()">Cancel</button></div>`}</div>`).join('')}`}
function chat(){if(!S.chat.length)return `<div class="h1">Chat</div><div class="card"><b>No messages</b><p class="mut">When you book, you can message your pro here. Chats are end-to-end sealed in the app.</p></div>`;const p=S.jobs[0].pro;
 return `<div class="row"><div class="av">${p[1]}</div><div><b>${p[0]}</b><br><span class="mut">Demo chat · replies are sample text</span></div></div>${S.chat.map(m=>`<div class="bub ${m.me?'me':'them'}">${m.t.replace(/</g,'&lt;')}</div>`).join('')}<div class="row" style="margin-top:12px"><input id="msg" placeholder="Message" style="margin:0"><button class="chip on" onclick="send()">Send</button></div>`}
function send(){const v=$('#msg').value.trim();if(!v)return;S.chat.push({me:1,t:v});render();setTimeout(()=>{S.chat.push({me:0,t:'Sounds good 👍'});if(S.tab==='chat')render()},1200)}
function pro(){if(!S.feed)S.feed=[['Move a sofa upstairs','Moving','Near TCU',110],['Mount a 65" TV','TV mount','Near Clearfork',90],['Fix leaking faucet','Plumbing','Near Magnolia',140]];
 return `<div class="h1">Pro</div><p class="mut">Jobs near you. You keep what you quote.</p><div class="card"><p class="mut">This week (demo)</p><div class="big">${money(640+S.earn)}</div><p class="mut">Instant payout to your bank in the app.</p></div>${S.feed.map((f,i)=>`<div class="card"><div class="row"><div><b>${f[0]}</b><br><span class="mut">${f[1]} · ${f[2]}</span></div><span class="sp"></span><b>${money(f[3])}</b></div><div class="row" style="gap:8px"><button class="btn ghost" onclick="S.feed.splice(${i},1);render()">Pass</button><button class="btn" onclick="S.earn+=S.feed[${i}][3];toast('Accepted (demo). You keep '+money(S.feed[${i}][3])+'.');S.feed.splice(${i},1);render()">Accept</button></div></div>`).join('')||'<div class="card mut">You cleared the board. New jobs show up here.</div>'}<button class="btn ghost" onclick="S.screen='signin';render()">Sign out of demo</button>`}
render();
</script></body></html>
